<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ennie Welcome</title>
  <!-- The welcome frame, drawn in code (welcome.js, welcome.css). The jar overlay (overlay.html) takes the
       frame from this page and shows it above the jar; opened on its own, this page shows just the frame.
       ?test shows sample viewers one after another; ?test=hold keeps one on screen. -->
  <link rel="stylesheet" href="/welcome.css">
  <style>html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }</style>
</head>
<body>
  <div class="welcome" id="welcome" aria-hidden="true">
    <div class="welcome-art" id="welcomeArt">
      <svg class="welcome-frame" viewBox="0 0 680 300" aria-hidden="true">
        <defs>
          <linearGradient id="wRoseGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff0c9"/><stop offset=".25" stop-color="#f582b8"/><stop offset=".5" stop-color="#ffd36e"/>
            <stop offset=".75" stop-color="#ff6fae"/><stop offset="1" stop-color="#b8306c"/>
          </linearGradient>
          <linearGradient id="wGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffc94a"/><stop offset="1" stop-color="#c47f10"/>
          </linearGradient>
          <linearGradient id="wPlaque" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd3e8"/><stop offset=".45" stop-color="#ff8cc2"/><stop offset="1" stop-color="#e2448f"/>
          </linearGradient>
          <linearGradient id="wRibbon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff5fa8"/><stop offset="1" stop-color="#9c1458"/>
          </linearGradient>
          <linearGradient id="wChiffon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff7fb8" stop-opacity="0"/><stop offset=".3" stop-color="#ff7fb8" stop-opacity=".8"/>
            <stop offset=".7" stop-color="#ffb3d6" stop-opacity=".7"/><stop offset="1" stop-color="#ffb3d6" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="wPearl" cx=".35" cy=".3" r=".75">
            <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fbe9f1"/><stop offset="1" stop-color="#d9b8c6"/>
          </radialGradient>
          <radialGradient id="wGlow"><stop offset="0" stop-color="#ff8fc4" stop-opacity=".95"/><stop offset=".55" stop-color="#ffb8d9" stop-opacity=".5"/><stop offset="1" stop-color="#ffd2e6" stop-opacity="0"/></radialGradient>
          <radialGradient id="wRose" cx=".45" cy=".4" r=".7">
            <stop offset="0" stop-color="#ffd0e4"/><stop offset=".5" stop-color="#ff4f97"/><stop offset="1" stop-color="#b3125c"/>
          </radialGradient>
          <linearGradient id="wShine" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <!-- A small rose: layered petals around a curl. -->
          <g id="wRoseShape">
            <circle r="13" fill="url(#wRose)"/>
            <path d="M-9 -2 C-7 -10 6 -11 9 -3 C11 4 4 10 -2 9 C-8 8 -11 3 -9 -2Z" fill="none" stroke="#c94a85" stroke-width="1.4" opacity=".55"/>
            <path d="M-4 -1 C-3 -5 4 -6 5 -1 C6 3 1 5 -2 4" fill="none" stroke="#c94a85" stroke-width="1.3" opacity=".6"/>
            <path d="M-11 6 C-16 4 -17 -2 -13 -5 M11 6 C16 4 17 -2 13 -5" fill="none" stroke="#fff" stroke-width="1.2" opacity=".7"/>
          </g>
          <g id="wLeaf"><path d="M0 0 C6 -8 18 -8 24 0 C18 8 6 8 0 0Z" fill="#6fcf7f" stroke="#2f8f4a" stroke-width="1.2"/><path d="M2 0 H21" stroke="#2f8f4a" stroke-width=".8"/></g>
          <!-- A gold filigree scroll, drawn for the left side and mirrored for the right. -->
          <path id="wScroll" d="M0 0 C-22 -6 -40 -26 -34 -46 C-29 -61 -10 -60 -9 -46 C-8 -36 -20 -34 -22 -42"
                fill="none" stroke="url(#wGold)" stroke-width="4" stroke-linecap="round"/>
          <linearGradient id="wRay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff2a8" stop-opacity="1"/><stop offset=".5" stop-color="#ff8fc4" stop-opacity=".65"/><stop offset="1" stop-color="#ffb3d6" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="wGem" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd1e8"/><stop offset=".45" stop-color="#ff4fa0"/><stop offset="1" stop-color="#9c1458"/>
          </linearGradient>
          <linearGradient id="wPlaqueEdge" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e98ab4"/><stop offset=".3" stop-color="#ffe3a3"/><stop offset=".55" stop-color="#e9a99b"/>
            <stop offset=".8" stop-color="#ffd6ea"/><stop offset="1" stop-color="#d36b9c"/>
          </linearGradient>
          <!-- A faceted heart-shaped jewel with a glint. -->
          <g id="wHeartGem">
            <path d="M0 9 C-3 5 -12 0 -12 -6 C-12 -11 -6 -14 0 -8 C6 -14 12 -11 12 -6 C12 0 3 5 0 9Z" fill="url(#wGem)" stroke="url(#wGold)" stroke-width="2"/>
            <path d="M-7 -7 C-6 -9 -4 -9 -3 -7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M0 -8 L0 9 M-12 -6 L0 2 L12 -6" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
          </g>
          <!-- A butterfly; its wings flap (scaleX) in welcome.js. -->
          <g id="wButterfly">
            <g class="wing">
              <path d="M0 0 C-10 -16 -24 -14 -22 -3 C-20 6 -8 4 0 0Z" fill="#ff9cc9" stroke="#fff" stroke-width="1.2"/>
              <path d="M0 0 C-8 6 -16 14 -10 18 C-4 21 0 10 0 0Z" fill="#ffc3df" stroke="#fff" stroke-width="1.2"/>
              <path d="M0 0 C10 -16 24 -14 22 -3 C20 6 8 4 0 0Z" fill="#ff9cc9" stroke="#fff" stroke-width="1.2"/>
              <path d="M0 0 C8 6 16 14 10 18 C4 21 0 10 0 0Z" fill="#ffc3df" stroke="#fff" stroke-width="1.2"/>
              <circle cx="-13" cy="-5" r="2.5" fill="#fff" opacity=".8"/><circle cx="13" cy="-5" r="2.5" fill="#fff" opacity=".8"/>
            </g>
            <path d="M0 -6 V10" stroke="#8e2f63" stroke-width="2.4" stroke-linecap="round"/>
          </g>
          <!-- Reveals the banner from the medallion outward; welcome.js widens the rectangle. -->
          <clipPath id="wBannerClip"><rect id="wBannerRect" x="200" y="-80" width="520" height="440"/></clipPath>
          <clipPath id="wShineClip">
            <circle cx="136" cy="144" r="86"/>
            <path d="M226 112 H620 Q640 112 640 132 V176 Q640 196 620 196 H226Z"/>
          </clipPath>
        </defs>

        <!-- Chiffon ribbons drifting behind everything. -->
        <g id="wChiffons" opacity=".9">
          <path d="M-10 210 C80 150 180 260 300 214 S520 150 690 200 L690 224 C520 176 410 250 300 240 S90 186 -10 236Z" fill="url(#wChiffon)"/>
          <path d="M20 96 C120 40 240 120 360 70 S560 30 670 90 L668 106 C560 52 470 110 360 92 S110 70 22 112Z" fill="url(#wChiffon)" opacity=".7"/>
          <path d="M-30 150 C40 120 90 180 160 150 S260 110 330 140 L330 152 C260 126 220 170 160 166 S50 140 -30 166Z" fill="url(#wChiffon)" opacity=".8"/>
        </g>
        <!-- Rays of light turning slowly behind the medallion, and a glow that breathes. -->
        <g id="wRays" transform="translate(136 144)" opacity=".85"></g>
        <ellipse id="wAura" cx="136" cy="144" rx="140" ry="128" fill="url(#wGlow)"/>

        <!-- The banner: pearl white and pink, rose gold edge, scrolled ends. -->
        <g id="wBanner" clip-path="url(#wBannerClip)">
          <path d="M214 108 H618 C640 108 650 124 650 140 V168 C650 184 640 200 618 200 H214 Z" fill="#d9799f" opacity=".35" transform="translate(3 5)"/>
          <!-- Lace scallops along the bottom edge, and a strand of pearls hanging under it. -->
          <g id="wLace"></g>
          <path id="wStrand" d="M250 206 Q430 250 620 206" fill="none"/>
          <g id="wStrandPearls"></g>
          <path d="M214 108 H618 C640 108 650 124 650 140 V168 C650 184 640 200 618 200 H214 Z" fill="url(#wPlaque)" stroke="url(#wPlaqueEdge)" stroke-width="7"/>
          <!-- Gold corner filigree inside the banner. -->
          <path d="M600 122 C614 122 630 128 632 140 M600 186 C614 186 630 180 632 168 M246 122 C262 120 270 116 276 110 M246 186 C262 188 270 192 276 198"
                fill="none" stroke="url(#wGold)" stroke-width="2.2" stroke-linecap="round"/>
          <use href="#wHeartGem" transform="translate(430 110) scale(1.15)"/>
          <use href="#wHeartGem" transform="translate(430 200) scale(.85)"/>
          <path d="M226 117 H614 C630 117 640 128 640 140 V168 C640 180 630 191 614 191 H226" fill="none" stroke="url(#wGold)" stroke-width="1.6" opacity=".9"/>
          <circle cx="652" cy="154" r="11" fill="url(#wPlaque)" stroke="url(#wRoseGold)" stroke-width="4"/>
          <circle cx="652" cy="154" r="4" fill="url(#wGold)"/>
          <use href="#wRoseShape" transform="translate(640 112) scale(.9)"/>
          <use href="#wLeaf" transform="translate(628 104) rotate(200) scale(.8)"/>
          <use href="#wRoseShape" transform="translate(632 200) scale(.75)"/>
        </g>

        <!-- Gold feather wings fanning out behind the medallion. -->
        <g id="wWings" transform="translate(136 144)" fill="none" stroke="url(#wGold)" stroke-linecap="round">
          <path d="M-70 -40 C-120 -70 -150 -40 -160 -10" stroke-width="5"/>
          <path d="M-74 -18 C-122 -36 -146 -6 -150 18" stroke-width="4.5"/>
          <path d="M-76 6 C-118 0 -136 26 -134 46" stroke-width="4"/>
          <path d="M-72 30 C-106 34 -116 56 -110 72" stroke-width="3.5"/>
          <path d="M-160 -10 C-150 -16 -144 -26 -150 -34 M-150 18 C-140 14 -134 4 -140 -4 M-134 46 C-124 42 -120 32 -126 26" stroke-width="3"/>
          <path d="M-70 -40 C-120 -70 -150 -40 -160 -10 L-150 18 L-134 46 L-110 72 C-90 60 -78 40 -76 6 Z" fill="#ffe2ee" fill-opacity=".55" stroke="none"/>
        </g>

        <!-- Filigree scrolls around the medallion. -->
        <g transform="translate(136 144)">
          <use href="#wScroll" transform="translate(-62 -58) rotate(-10)"/>
          <use href="#wScroll" transform="translate(62 -58) scale(-1 1) rotate(-10)"/>
          <use href="#wScroll" transform="translate(-70 46) scale(1 -1) rotate(-20)"/>
          <use href="#wScroll" transform="translate(70 46) scale(-1 -1) rotate(-20)"/>
          <!-- A small crown with a heart on top. -->
          <g transform="translate(0 -108)">
            <path d="M-26 6 L-30 -16 L-14 -4 L0 -24 L14 -4 L30 -16 L26 6 Z" fill="url(#wGold)" stroke="#a87632" stroke-width="1.5" stroke-linejoin="round"/>
            <rect x="-27" y="4" width="54" height="7" rx="3" fill="url(#wRoseGold)" stroke="#a87632" stroke-width="1.2"/>
            <circle cx="-30" cy="-17" r="3.5" fill="url(#wPearl)"/><circle cx="30" cy="-17" r="3.5" fill="url(#wPearl)"/>
            <path d="M0 -20 C-5 -28 -13 -24 -10 -17 C-8 -12 0 -8 0 -8 C0 -8 8 -12 10 -17 C13 -24 5 -28 0 -20Z" fill="#ff7fb4" stroke="#fff" stroke-width="1.5" transform="translate(0 -10)"/>
          </g>
        </g>

        <!-- The medallion: rose gold ring with pearls. The picture sits inside it (.welcome-avatar). -->
        <g id="wMedallion" transform="translate(136 144)">
          <circle id="wDotRing" r="110" fill="none" stroke="url(#wGold)" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
          <circle r="84" fill="none" stroke="#ff7fb8" stroke-width="22" stroke-opacity=".25"/>
          <circle r="84" fill="none" stroke="url(#wRoseGold)" stroke-width="16"/>
          <use href="#wHeartGem" transform="translate(0 84) scale(1.1)"/>
          <use href="#wHeartGem" transform="translate(-84 0) rotate(-90) scale(.8)"/>
          <use href="#wHeartGem" transform="translate(84 0) rotate(90) scale(.8)"/>
          <circle r="75" fill="none" stroke="url(#wGold)" stroke-width="2.5"/>
          <circle r="93" fill="none" stroke="url(#wGold)" stroke-width="2"/>
          <g id="wPearls"></g>
        </g>

        <!-- The small ribbon under the medallion. -->
        <g id="wBadge" transform="translate(136 236)">
          <path d="M-74 -6 L-90 -14 L-82 4 L-90 20 L-66 14Z M74 -6 L90 -14 L82 4 L90 20 L66 14Z" fill="#a8285f" stroke="url(#wGold)" stroke-width="1.5"/>
          <path d="M-70 -14 H70 L76 2 L70 18 H-70 L-76 2Z" fill="url(#wRibbon)" stroke="url(#wGold)" stroke-width="2.5"/>
        </g>

        <!-- Clusters of roses at the medallion's corners and on the banner. -->
        <use href="#wLeaf" transform="translate(56 222) rotate(160) scale(1.2)"/>
        <use href="#wLeaf" transform="translate(70 226) rotate(110)"/>
        <use href="#wRoseShape" transform="translate(64 210) scale(1.5)"/>
        <use href="#wRoseShape" transform="translate(40 196) scale(1)"/>
        <use href="#wRoseShape" transform="translate(84 228) scale(.85)"/>
        <use href="#wLeaf" transform="translate(214 70) rotate(-40) scale(1.1)"/>
        <use href="#wRoseShape" transform="translate(210 82) scale(1.3)"/>
        <use href="#wRoseShape" transform="translate(232 100) scale(.85)"/>
        <use href="#wRoseShape" transform="translate(192 66) scale(.75)"/>

        <!-- Butterflies, flown by welcome.js. -->
        <use id="wFly1" href="#wButterfly"/>
        <use id="wFly2" href="#wButterfly"/>
        <use id="wFly3" href="#wButterfly"/>

        <!-- A sweep of light across the frame, moved by welcome.js. -->
        <g clip-path="url(#wShineClip)"><rect id="wShineBar" x="-120" y="40" width="70" height="230" fill="url(#wShine)" transform="skewX(-20)"/></g>
      </svg>
      <div class="welcome-avatar" id="welcomeAvatar"></div>
      <video class="welcome-dog" id="welcomeDog" src="/media/welcome_dog.webm" muted loop playsinline preload="auto" aria-hidden="true"></video>
      <div class="welcome-text">
        <div class="welcome-hello">Chào mừng</div>
        <div class="welcome-name" id="welcomeName">Tên người xem</div>
        <div class="welcome-sub">đã đến với live của Ennie 🐾</div>
      </div>
      <div class="welcome-badge" id="welcomeBadge">KHÁCH QUÝ</div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/welcome.js"></script>
</body>
</html>
