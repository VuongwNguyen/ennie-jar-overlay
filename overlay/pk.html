<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ennie PK</title>
  <!-- The PK panel of the jar game (pk.js), a part of its own on live.html: Phe Phá against Phe Giữ, the clock,
       the dare, and the honours when time is up; the guide between rounds.
       pk.html?preview shows a made-up round, to place it on the layout page. -->
  <style>
    @font-face { font-family: "Pacifico"; src: url("/vendor/pacifico.woff2") format("woff2"); font-display: swap; }
    :root {
      --raid: #8f5ad6; --raid-deep: #6a35b0; --raid-soft: rgb(239 228 255 / var(--veil-inner));
      --guard: #ff6fb1; --guard-deep: #d63f87; --guard-soft: rgb(255 227 241 / var(--veil-inner));
      /* How solid the panels' backgrounds are, 0 to 1: set on the layout page ("Độ đậm nền", pk.js). The boxes
         inside stay a little more solid, so the writing on them keeps something behind it. */
      --veil: .55; --veil-inner: calc(.4 + var(--veil) * .6);
      --ink: #5a2a4a;
    }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* Titles in the handwritten font are thin: a stronger white edge keeps them clear over the stream. */
    .result h1, .guide h1 { text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 10px #ffffffc0; }
    /* The panel lets the stream show through; a soft white edge around the letters keeps them readable on it. */
    body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); text-shadow: 0 0 2px #fff, 0 0 5px #ffffffb0; }
    /* Drawn at 800 x 300 and scaled to fit the part's box (pk.js sets --fit). */
    .pk {
      position: absolute; left: 50%; top: 50%; width: 800px; height: 300px;
      transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: 50% 50%;
      opacity: 0; transition: opacity .4s;
    }
    .pk.on { opacity: 1; }
    .board {
      position: absolute; inset: 0 0 30px 0; padding: 14px 18px; box-sizing: border-box; border-radius: 28px;
      background: linear-gradient(180deg, rgb(255 250 253 / var(--veil)), rgb(255 241 248 / var(--veil))); border: 3px solid #ffd0e8;
      box-shadow: 0 4px 14px #3b1a3226, inset 0 2px 0 #fff8;
    }
    /* During a round the board is only as tall as what is on it (the dare sits between the two sides' top givers,
       so there is no row of its own below); the guide and the result keep the full height. */
    .pk:not(.done):not(.guiding) .board { inset: 0 0 80px 0; }
    .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; height: 76px; }
    .side { display: flex; flex-direction: column; line-height: 1.05; }
    .side b { font-size: 26px; font-weight: 900; letter-spacing: .5px; }
    /* One gift of the side at a time, flipping to the next every few seconds (pk.js), so every gift gets seen. */
    .flip { display: flex; align-items: center; gap: 7px; height: 34px; margin-top: 5px; }
    .side.guard .flip { justify-content: flex-end; }
    .flip .card { display: flex; align-items: center; gap: 7px; padding: 2px 12px 2px 4px; border-radius: 17px; background: #fff; box-shadow: 0 2px 6px #3b1a3226; white-space: nowrap; transform-origin: 50% 50%; }
    .side.raid .flip .card { border: 2px solid var(--raid); }
    .side.guard .flip .card { border: 2px solid var(--guard); flex-direction: row-reverse; padding: 2px 4px 2px 12px; }
    /* The flip only uncovers and covers the card from its middle line (clip-path), never scaling or fading it: a
       transform or fade inside the scaled panel is drawn small and blown up, which blurs the text for a moment.
       This way the text is always drawn at full size and stays sharp, even while it flips. */
    .flip .card.in { animation: flip-in .3s ease-out; }
    .flip .card.out { animation: flip-out .18s ease-in forwards; }
    @keyframes flip-in { from { clip-path: inset(50% -10px 50% -10px); } to { clip-path: inset(-10px -10px -10px -10px); } }
    @keyframes flip-out { from { clip-path: inset(-10px -10px -10px -10px); } to { clip-path: inset(50% -10px 50% -10px); } }
    .flip .pic { width: 28px; height: 28px; display: grid; place-items: center; font-size: 18px; }
    .flip .pic img { width: 100%; height: 100%; object-fit: contain; }
    .flip b { font-size: 18px !important; letter-spacing: 0 !important; color: var(--ink) !important; }
    .flip em { font-style: normal; font-size: 14px; font-weight: 800; opacity: .75; }
    .side.raid b { color: var(--raid-deep); }
    .side.guard { text-align: right; }
    .side.guard b { color: var(--guard-deep); }
    .clock {
      min-width: 112px; padding: 4px 16px; border-radius: 22px; text-align: center; box-sizing: border-box;
      background: #fff; border: 3px solid #ffc0de; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .clock.hurry { border-color: #ff4f7b; color: #e2245a; animation: tick 1s infinite; }
    /* Pulses by colour and glow only: a scaling pulse would blur the numbers (see .flip). */
    @keyframes tick { 50% { background: #ffe3ec; box-shadow: 0 0 0 6px #ff4f7b40; } }
    .bar-wrap { position: relative; margin-top: 10px; }
    .bar {
      position: relative; height: 54px; border-radius: 27px; overflow: hidden;
      background: var(--guard); box-shadow: inset 0 3px 6px #0002;
    }
    .fill-raid { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, var(--raid-deep), var(--raid)); transition: width .6s cubic-bezier(.2, .9, .3, 1.2); }
    .fill-guard { position: absolute; inset: 0; background: linear-gradient(90deg, var(--guard), var(--guard-deep)); }
    .spark { position: absolute; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; font-size: 34px; line-height: 46px; text-align: center; transition: left .6s cubic-bezier(.2, .9, .3, 1.2); filter: drop-shadow(0 0 6px #fff); }
    .score { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px #0005; font-variant-numeric: tabular-nums; }
    .score.raid { left: 20px; }
    .score.guard { right: 20px; }
    /* How many points a coin to Phe Giữ counts for, before its score. */
    .score .boost { margin-right: 8px; padding: 1px 8px; border-radius: 999px; background: #fff3; border: 1.5px solid #fffc; font-size: 16px; font-weight: 900; line-height: 1.3; }
    .mvps { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-top: 10px; height: 40px; }
    .mvps .dare { margin-top: 0; min-width: 0; height: 34px; font-size: 15px; gap: 6px; padding: 0 10px; }
    .mvp { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 16px; font-weight: 700; }
    .mvp.guard { flex-direction: row-reverse; text-align: right; }
    .mvp .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mvp em { font-style: normal; font-size: 13px; opacity: .75; display: block; }
    .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: #fff; font-size: 20px; }
    .mvp.raid .avatar { border: 3px solid var(--raid); }
    /* Top 1 in front; top 2 and 3 tucked behind it, a little smaller, toward the middle of the panel. */
    .mvp .stack { display: flex; align-items: center; flex: none; }
    .mvp .stack .avatar { position: relative; box-shadow: 0 1px 4px #0003; }
    .mvp .stack .rank1 { z-index: 3; }
    .mvp .stack .rank2 { z-index: 2; width: 34px; height: 34px; font-size: 16px; margin-left: -12px; }
    .mvp .stack .rank3 { z-index: 1; width: 29px; height: 29px; font-size: 14px; margin-left: -11px; }
    .mvp.guard .stack { flex-direction: row-reverse; }
    .mvp.guard .stack .rank2, .mvp.guard .stack .rank3 { margin-left: 0; margin-right: -12px; }
    .mvp.guard .avatar { border: 3px solid var(--guard); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .dare { margin-top: 10px; height: 36px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; background: rgb(255 247 214 / var(--veil-inner)); border: 2px dashed #f4c95d; font-size: 18px; font-weight: 800; color: #9a5a12; white-space: nowrap; overflow: hidden; }
    .dare span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    /* The result, in place of the board for a while once time is up. */
    .result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; box-sizing: border-box; border-radius: 28px; text-align: center; }
    .pk.done .result { display: flex; }
    .pk.done .board { display: none; }
    .result.raid { background: linear-gradient(180deg, rgb(246 238 255 / var(--veil)), rgb(230 212 255 / var(--veil))); border: 3px solid var(--raid); }
    .result.guard { background: linear-gradient(180deg, rgb(255 243 250 / var(--veil)), rgb(255 217 236 / var(--veil))); border: 3px solid var(--guard); }
    .result.draw { background: linear-gradient(180deg, rgb(255 253 242 / var(--veil)), rgb(255 240 200 / var(--veil))); border: 3px solid #f4c95d; }
    .result h1 { margin: 0; font-family: "Pacifico", cursive; font-weight: 400; font-size: 40px; line-height: 1.2; }
    .result.raid h1 { color: var(--raid-deep); }
    .result.guard h1 { color: var(--guard-deep); }
    .result.draw h1 { color: #9a5a12; }
    .result p { margin: 0; font-size: 20px; font-weight: 800; }
    /* The result (pk.js showResult): a ribbon, the result card and the podium. */
    /* isolation: the ribbon's tails (z-index -1) sit behind the ribbon but in front of this box's background. */
    .result.raid, .result.guard, .result.draw { justify-content: flex-start; gap: 14px; padding: 12px 22px 16px; isolation: isolate; }
    .rs-ribbon { position: relative; padding: 2px 46px 4px; border-radius: 10px; box-shadow: 0 4px 12px #3b1a3233; animation: rs-drop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
    .rs-ribbon::before, .rs-ribbon::after { content: ""; position: absolute; top: 10px; width: 30px; height: 100%; z-index: -1; filter: brightness(.8); }
    .rs-ribbon::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 38% 50%); }
    .rs-ribbon::after { right: -18px; clip-path: polygon(0 0, 100% 0, 62% 50%, 100% 100%, 0 100%); }
    .result.raid .rs-ribbon, .result.raid .rs-ribbon::before, .result.raid .rs-ribbon::after { background: linear-gradient(90deg, var(--raid-deep), var(--raid)); }
    .result.guard .rs-ribbon, .result.guard .rs-ribbon::before, .result.guard .rs-ribbon::after { background: linear-gradient(90deg, var(--guard), var(--guard-deep)); }
    .result.draw .rs-ribbon, .result.draw .rs-ribbon::before, .result.draw .rs-ribbon::after { background: linear-gradient(90deg, #f2b632, #e0952a); }
    .result .rs-ribbon h1 { font-size: 32px; color: #fff; text-shadow: 0 2px 6px #0004; }
    @keyframes rs-drop { from { transform: translateY(-30px); opacity: 0; } }
    .rs-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; width: 100%; flex: 1; min-height: 0; align-items: stretch; }
    .rs-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 16px 12px; border-radius: 20px;
      background: rgb(255 255 255 / var(--veil-inner)); box-shadow: 0 4px 12px #3b1a321f, inset 0 2px 0 #fff; animation: pv-in .5s cubic-bezier(.2, .9, .3, 1.15) .1s both; --from: -40px; }
    .result.raid .rs-card { border: 3px solid var(--raid); }
    .result.guard .rs-card { border: 3px solid var(--guard); }
    .result.draw .rs-card { border: 3px solid #f4c95d; }
    .result.raid .rs-card .pv-tag { background: var(--raid-deep); }
    .result.guard .rs-card .pv-tag { background: var(--guard-deep); }
    .result.draw .rs-card .pv-tag { background: #d98a1c; }
    .result .rs-message { font-size: 24px; font-weight: 900; line-height: 1.25; color: var(--ink); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .rs-score { display: flex; align-items: center; gap: 10px; }
    .rs-side { position: relative; display: flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px; font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px #0005; opacity: .6; }
    .rs-side.raid { background: linear-gradient(90deg, var(--raid-deep), var(--raid)); }
    .rs-side.guard { background: linear-gradient(90deg, var(--guard), var(--guard-deep)); }
    .rs-side i { font-style: normal; font-size: 16px; }
    .rs-side small { font-size: 13px; padding: 0 6px; border-radius: 999px; background: #fff3; border: 1.5px solid #fffc; }
    .rs-side.win { opacity: 1; box-shadow: 0 0 0 3px #ffd86f, 0 0 14px #ffd86f; }
    .rs-side.win::before { content: "👑"; position: absolute; left: 50%; top: -19px; transform: translateX(-50%) rotate(-8deg); font-size: 18px; text-shadow: none; }
    .rs-vs { font-size: 15px; font-weight: 900; color: var(--ink); opacity: .55; }
    /* The podium: three steps, gold in the middle and highest, a glow behind it. */
    .rs-podium { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 6px; animation: pv-in .5s cubic-bezier(.2, .9, .3, 1.15) .2s both; --from: 40px; }
    .rs-podium::before { content: ""; position: absolute; left: 50%; top: 0; width: 200px; height: 170px; transform: translateX(-50%); background: radial-gradient(circle, #ffe9a8cc, #ffe9a800 70%); pointer-events: none; }
    .rs-place { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; font-weight: 800; }
    .rs-place .medal { font-size: 18px; line-height: 1; }
    .rs-place .avatar { width: 52px; height: 52px; font-size: 22px; border: 3px solid #fff; box-shadow: 0 2px 8px #3b1a3233; }
    .rs-place.p1 .avatar { width: 66px; height: 66px; border-color: #f2b632; box-shadow: 0 0 0 3px #ffe9a8, 0 0 16px #f4c95d; }
    .rs-place .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .rs-place em { font-style: normal; font-size: 12px; opacity: .7; }
    .rs-place .step { display: grid; place-items: center; width: 100%; margin-top: 4px; border-radius: 10px 10px 4px 4px; font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px #0005; box-shadow: inset 0 2px 0 #fff8, 0 3px 8px #3b1a3226; }
    .rs-place.p1 .step { height: 44px; background: linear-gradient(180deg, #ffd86f, #e8a92a); }
    .rs-place.p2 .step { height: 30px; background: linear-gradient(180deg, #e3e6ee, #a9afbf); }
    .rs-place.p3 .step { height: 20px; background: linear-gradient(180deg, #f2c49b, #c98650); }
    .rs-place.empty .step { opacity: .35; }
    .rs-empty { grid-column: 1 / -1; align-self: center; margin: 0; text-align: center; font-size: 17px !important; opacity: .7; }
    /* After the honours: everyone who gave, on both sides, scrolling by itself when the list is long. */
    .result.thanks { background: linear-gradient(180deg, rgb(255 250 253 / var(--veil)), rgb(255 241 248 / var(--veil))); border: 3px solid #ffd0e8; justify-content: flex-start; gap: 6px; }
    .result.thanks h1 { font-size: 30px; color: #d63f87; }
    .thank-cols { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 12px; width: 100%; flex: 1; min-height: 0; overflow: hidden; }
    .thank-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-radius: 16px; padding: 6px 10px; }
    .thank-col.raid { background: var(--raid-soft); border: 2px solid var(--raid); }
    .thank-col.guard { background: var(--guard-soft); border: 2px solid var(--guard); }
    .thank-col h2 { margin: 0 0 4px; font-size: 16px; font-weight: 900; text-align: left; }
    .thank-col.raid h2 { color: var(--raid-deep); }
    .thank-col.guard h2 { color: var(--guard-deep); }
    .thank-col ol { list-style: none; margin: 0; padding: 0; overflow: hidden; flex: 1; min-height: 0; }
    .thank-col li { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.5; text-align: left; }
    .thank-col li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thank-col li em { font-style: normal; opacity: .7; white-space: nowrap; }
    .thank-col .none { opacity: .6; font-weight: 600; }
    /* A new round's dare, shown with a countdown before the clock starts. */
    .result.preview { background: linear-gradient(180deg, rgb(255 251 253 / var(--veil)), rgb(255 238 247 / var(--veil))); border: 3px solid #ffc0de; gap: 18px; padding: 14px 22px 18px; }
    .pv-top { position: relative; width: 100%; display: flex; justify-content: center; }
    .result.preview h1 { font-size: 34px; color: #d63f87; }
    /* The seconds left, in a ring that empties (pk.js sets how long). */
    .pv-ring { position: absolute; right: 0; top: 50%; width: 58px; height: 58px; margin-top: -29px; display: grid; place-items: center; }
    .pv-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .pv-ring circle { fill: #fff; stroke-width: 6; }
    .pv-ring .track { stroke: #ffe0ef; }
    .pv-ring .left { fill: none; stroke: var(--guard-deep); stroke-linecap: round; stroke-dasharray: 157; animation: pv-drain linear forwards; }
    @keyframes pv-drain { to { stroke-dashoffset: 157; } }
    .pv-ring b { position: relative; font-size: 24px; font-weight: 900; color: var(--guard-deep); font-variant-numeric: tabular-nums; }
    /* The dare and the boost, each on its card with a tag sitting on its top edge. */
    .pv-cards { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 16px; width: 100%; }
    .pv-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 132px; padding: 22px 16px 12px; box-sizing: border-box; border-radius: 20px;
      box-shadow: 0 4px 12px #3b1a321f, inset 0 2px 0 #fff; animation: pv-in .5s cubic-bezier(.2, .9, .3, 1.15) both; }
    .pv-card.pv-raid { background: rgb(247 240 255 / var(--veil-inner)); border: 3px solid var(--raid); --from: -40px; }
    .pv-card.pv-guard { background: rgb(255 236 246 / var(--veil-inner)); border: 3px solid var(--guard); --from: 40px; animation-delay: .12s; }
    @keyframes pv-in { from { transform: translateX(var(--from)); opacity: 0; } }
    .pv-tag { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 14px; border-radius: 999px; font-size: 15px; font-weight: 900; color: #fff; text-shadow: none; border: 2px solid #fff; box-shadow: 0 2px 6px #3b1a3233; }
    .pv-card.pv-raid .pv-tag { background: var(--raid-deep); }
    .pv-card.pv-guard .pv-tag { background: var(--guard-deep); }
    .pv-dare { margin: 0; font-size: 28px !important; font-weight: 900; line-height: 1.25; color: var(--ink); text-wrap: balance;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    /* Under the dare: how much more Phe Phá needs to win. */
    .result .pv-rule { margin: 0; padding: 2px 12px; border-radius: 999px; background: var(--raid-deep); color: #fff; font-size: 14px; font-weight: 800; text-shadow: none; }
    /* Phe Giữ's boost for the round, on a reel that spins and stops (pk.js rollBoost). */
    .reel { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 128px; height: 62px; padding: 0 14px; box-sizing: border-box; border-radius: 16px;
      background: linear-gradient(180deg, #fff, #ffe6f2); border: 3px solid var(--guard); box-shadow: inset 0 3px 6px #d63f8730; overflow: visible; }
    .reel .value { display: inline-block; font-size: 42px; line-height: 1; color: var(--guard-deep); font-variant-numeric: tabular-nums; }
    .reel.rolling { clip-path: inset(-2px round 16px); }
    .reel.rolling .value.spin { animation: reel-spin .09s linear; }
    @keyframes reel-spin { from { transform: translateY(-34px); opacity: .3; filter: blur(1px); } to { transform: none; opacity: 1; } }
    .reel.landed { animation: reel-land .7s cubic-bezier(.2, 1.6, .4, 1); background: linear-gradient(180deg, #fff6fb, #ffc9e2); }
    .reel.landed .value { animation: reel-glow 1.2s ease-in-out .5s infinite alternate; }
    @keyframes reel-land { 0% { transform: scale(1); } 30% { transform: scale(1.45) rotate(-4deg); box-shadow: 0 0 0 10px #ff6fae55, 0 0 26px #ff4f9e; } 100% { transform: scale(1.08); box-shadow: 0 0 0 4px #ff6fae33, 0 0 12px #ff8fc0; } }
    @keyframes reel-glow { to { text-shadow: 0 0 8px #ff8fc0, 0 0 2px #fff; } }
    .pv-card .cheer { height: 22px; font-size: 17px; font-weight: 900; color: #d63f87; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .45s cubic-bezier(.2, 1.6, .4, 1); }
    .pv-card .cheer.on { opacity: 1; transform: none; }
    .boost-heart { position: absolute; left: 50%; top: 50%; font-size: 20px; pointer-events: none; animation: boost-heart .95s cubic-bezier(.15, .7, .3, 1) forwards; }
    @keyframes boost-heart { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 70% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(25deg); opacity: 0; } }
    /* A gift's coins rising off the bar; on Phe Giữ's side the boost flies into them and they become points. */
    .gains { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .gain { position: absolute; top: 50%; padding: 2px 12px; border-radius: 999px; white-space: nowrap; font-size: 22px; font-weight: 900; line-height: 1.3;
      background: #fff; box-shadow: 0 3px 10px #3b1a3240; text-shadow: none; animation: gain-rise 1.5s cubic-bezier(.2, .8, .3, 1) forwards; }
    .gain small { font-size: 14px; font-weight: 800; opacity: .7; margin-left: 3px; }
    .gain.raid { left: 18px; color: var(--raid-deep); border: 2.5px solid var(--raid); }
    .gain.guard { right: 18px; color: var(--guard-deep); border: 2.5px solid var(--guard); }
    /* A like's or a comment's point: smaller than a gift's. */
    .gain.cheer { font-size: 17px; padding: 1px 9px; animation-duration: 1.3s; }
    /* A boosted gift waits up high while the boost flies in, then rises off. */
    .gain.guard.boosted { animation: gain-wait .45s cubic-bezier(.2, .8, .3, 1) forwards, gain-leave .6s ease-in 1.55s forwards; }
    .gain.multiplied { background: linear-gradient(180deg, #fff, #ffe0ef); box-shadow: 0 0 0 4px #ff6fae55, 0 0 18px #ff4f9e; }
    .gain.multiplied b { display: inline-block; animation: gain-pop .5s cubic-bezier(.2, 1.8, .4, 1); }
    @keyframes gain-rise { 0% { transform: translateY(-50%); opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-140%); opacity: 0; } }
    @keyframes gain-wait { from { transform: translateY(-50%); opacity: 0; } to { transform: translateY(-115%); opacity: 1; } }
    @keyframes gain-leave { from { transform: translateY(-115%); opacity: 1; } to { transform: translateY(-190%); opacity: 0; } }
    @keyframes gain-pop { 0% { transform: scale(1.7); } 100% { transform: none; } }
    /* The boost, flying from Phe Giữ's score into the gift's coins. */
    .boost-fly { position: absolute; padding: 1px 8px; border-radius: 999px; font-size: 18px; font-weight: 900; color: #fff; background: var(--guard-deep); border: 2px solid #fff;
      box-shadow: 0 0 12px #ff4f9e; transition: transform .38s cubic-bezier(.5, -.4, .6, 1.2), opacity .2s .3s; }
    .gain-spark { position: absolute; font-size: 16px; animation: gain-spark .7s ease-out forwards; }
    @keyframes gain-spark { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))); opacity: 0; } }
    /* The boost on the bar flashes as it is put on a gift. */
    .score .boost.flash { animation: boost-flash .5s ease-out; }
    @keyframes boost-flash { 30% { background: #fff; color: var(--guard-deep); box-shadow: 0 0 14px #fff; } }
    /* ---------- Moving between screens (pk.js transition) ---------- */
    .curtain { position: absolute; inset: 0; z-index: 20; overflow: hidden; border-radius: 28px; pointer-events: none; }
    /* A new round: Phe Phá's half from the left, Phe Giữ's from the right, "VS" where they meet, then apart. */
    .curtain.vs .half { position: absolute; top: 0; bottom: 0; width: 52%; display: grid; place-items: center; font-size: 70px; }
    .curtain.vs .half.raid { left: 0; background: linear-gradient(90deg, var(--raid-deep), var(--raid)); clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); animation: half-left 1.15s cubic-bezier(.6, 0, .3, 1) forwards; }
    .curtain.vs .half.guard { right: 0; background: linear-gradient(90deg, var(--guard), var(--guard-deep)); clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); animation: half-right 1.15s cubic-bezier(.6, 0, .3, 1) forwards; }
    @keyframes half-left { 0% { transform: translateX(-105%); } 30%, 68% { transform: none; } 100% { transform: translateX(-105%); } }
    @keyframes half-right { 0% { transform: translateX(105%); } 30%, 68% { transform: none; } 100% { transform: translateX(105%); } }
    .curtain .vs-badge { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px; display: grid; place-items: center; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6c9, #ffd86f 55%, #e8a92a); border: 5px solid #fff; color: #7a3d00; font-size: 40px; font-weight: 900; font-style: italic;
      text-shadow: 0 2px 0 #fff8; box-shadow: 0 0 0 6px #ffd86f66, 0 0 30px #fff; opacity: 0; animation: vs-pop 1.15s cubic-bezier(.2, 1.6, .4, 1) forwards; }
    @keyframes vs-pop { 0%, 24% { transform: scale(3) rotate(-25deg); opacity: 0; } 36% { transform: scale(1) rotate(-8deg); opacity: 1; } 62% { transform: scale(1.08) rotate(-8deg); opacity: 1; } 75%, 100% { transform: scale(.3); opacity: 0; } }
    /* The end of a round: a sheet over the board and "HẾT GIỜ!" stamped on it. */
    .curtain.timeup .sheet { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(255 251 253 / .96), rgb(255 228 240 / .96)); animation: sheet 1.35s ease forwards; }
    @keyframes sheet { 0% { opacity: 0; } 18%, 72% { opacity: 1; } 100% { opacity: 0; } }
    .curtain .timeup-word { position: absolute; left: 50%; top: 50%; white-space: nowrap; font-size: 64px; font-weight: 900; color: #e2245a; -webkit-text-stroke: 3px #fff; text-shadow: 0 6px 18px #e2245a55;
      opacity: 0; animation: timeup-slam 1.35s cubic-bezier(.3, 1.5, .5, 1) forwards; }
    @keyframes timeup-slam { 0%, 8% { transform: translate(-50%, -50%) scale(2.6) rotate(-6deg); opacity: 0; } 26% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; }
      30% { transform: translate(calc(-50% - 5px), -50%) scale(1) rotate(-6deg); } 34% { transform: translate(calc(-50% + 4px), -50%) scale(1) rotate(-6deg); } 66% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; } 82%, 100% { transform: translate(-50%, -50%) scale(.7) rotate(-6deg); opacity: 0; } }
    /* The clock starting: "BẮT ĐẦU!" zooming in over the board as its parts come in. */
    .go-burst { position: absolute; left: 50%; top: 110px; z-index: 15; pointer-events: none; white-space: nowrap; font-size: 62px; font-weight: 900; color: #fff; -webkit-text-stroke: 3px var(--guard-deep);
      text-shadow: 0 0 18px #ff6fae, 0 6px 14px #3b1a3255; animation: go-burst 1.1s cubic-bezier(.2, 1.2, .4, 1) forwards; }
    @keyframes go-burst { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 60% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
    /* The board's parts coming in whenever it is shown: the head from above, the bar opening out from the
       middle, the givers and the dare from below. */
    .pk:not(.done):not(.guiding) .board .head { animation: enter-down .5s cubic-bezier(.2, .9, .3, 1.15) both; }
    .pk:not(.done):not(.guiding) .board .bar-wrap { animation: enter-open .6s cubic-bezier(.2, .9, .3, 1.1) .12s both; }
    .pk:not(.done):not(.guiding) .board .mvps { animation: enter-up .5s cubic-bezier(.2, .9, .3, 1.15) .25s both; }
    @keyframes enter-down { from { transform: translateY(-24px); opacity: 0; } }
    @keyframes enter-up { from { transform: translateY(20px); opacity: 0; } }
    @keyframes enter-open { from { transform: scaleX(.15); opacity: 0; } }
    /* The guide: its title from above, the two sides' boxes from their own sides, the line under from below. */
    .pk.guiding .guide h1 { animation: enter-down .5s cubic-bezier(.2, .9, .3, 1.15) both; }
    .pk.guiding .guide .team.raid { animation: pv-in .55s cubic-bezier(.2, .9, .3, 1.15) .1s both; --from: -50px; }
    .pk.guiding .guide .team.guard { animation: pv-in .55s cubic-bezier(.2, .9, .3, 1.15) .18s both; --from: 50px; }
    .pk.guiding .guide p { animation: enter-up .5s ease .3s both; }
    /* The thank-you list after the honours, and the honours after it: each slides in. */
    .result.thanks > * { animation: enter-up .45s cubic-bezier(.2, .9, .3, 1.1) both; }
    .result.thanks > :nth-child(2) { animation-delay: .1s; }
    /* ---------- Effects in a round (pk.js) ---------- */
    .board-fx { position: absolute; inset: 0; overflow: hidden; border-radius: 25px; pointer-events: none; z-index: 5; }
    /* The lead changing hands: a banner sweeping across the bar from the new leader's side. */
    .lead-banner { position: absolute; left: 50%; top: 127px; padding: 6px 26px; border-radius: 999px; white-space: nowrap; font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px #0005;
      border: 3px solid #fff; box-shadow: 0 4px 16px #3b1a3255, 0 0 22px #fff8; animation: lead-sweep 2s cubic-bezier(.2, .9, .3, 1) forwards; }
    .lead-banner.raid { background: linear-gradient(90deg, var(--raid-deep), var(--raid)); --from: -480px; --to: 480px; }
    .lead-banner.guard { background: linear-gradient(90deg, var(--guard), var(--guard-deep)); --from: 480px; --to: -480px; }
    @keyframes lead-sweep { 0% { transform: translate(calc(-50% + var(--from)), -50%) skewX(-12deg); } 22% { transform: translate(-50%, -50%) skewX(0); }
      78% { transform: translate(-50%, -50%); opacity: 1; } 100% { transform: translate(calc(-50% + var(--to)), -50%) skewX(12deg); opacity: 0; } }
    .spark.boom { animation: spark-boom .7s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes spark-boom { 30% { transform: scale(2.4) rotate(30deg); filter: drop-shadow(0 0 14px #fff) drop-shadow(0 0 8px #ffd86f); } }
    .bar-wrap.shake { animation: bar-shake .45s ease-in-out; }
    @keyframes bar-shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    /* A big gift: the giver sweeping across the top of the board, and their side lit up. */
    .big-gift { position: absolute; left: 50%; top: 18px; display: flex; align-items: center; gap: 10px; padding: 5px 20px 5px 6px; border-radius: 999px; white-space: nowrap;
      font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #0006; border: 3px solid #ffe9a8; box-shadow: 0 0 0 3px #ffd86f88, 0 6px 18px #3b1a3255;
      animation: big-sweep 3s cubic-bezier(.2, .9, .3, 1) forwards; }
    .big-gift.raid { background: linear-gradient(90deg, var(--raid-deep), var(--raid)); --from: -560px; --to: 560px; }
    .big-gift.guard { background: linear-gradient(90deg, var(--guard), var(--guard-deep)); --from: 560px; --to: -560px; }
    .big-gift .avatar { width: 44px; height: 44px; border: 2px solid #fff; color: var(--ink); text-shadow: none; }
    .big-gift b { font-weight: 900; color: #fff3b0; }
    .big-gift em, .big-gift i { font-style: normal; font-weight: 900; }
    @keyframes big-sweep { 0% { transform: translateX(calc(-50% + var(--from))); } 18% { transform: translateX(-50%); } 82% { transform: translateX(-50%); opacity: 1; } 100% { transform: translateX(calc(-50% + var(--to))); opacity: 0; } }
    .pk.glow-raid .fill-raid, .pk.glow-guard .fill-guard { animation: side-glow 1.6s ease-out; }
    .pk.glow-raid .side.raid b, .pk.glow-guard .side.guard b { animation: name-glow 1.6s ease-out; }
    @keyframes side-glow { 20% { filter: brightness(1.45) saturate(1.2); } }
    @keyframes name-glow { 20% { text-shadow: 0 0 10px #fff, 0 0 18px #ffd86f, 0 0 26px #ffd86f; } }
    /* The line Phe Phá has to pass to win, across the bar, with its label just above it. */
    .win-line { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 3px dashed #fff; z-index: 1; pointer-events: none; filter: drop-shadow(0 0 2px #6a35b0) drop-shadow(0 0 3px #6a35b0aa); }
    .win-line span { position: absolute; bottom: calc(100% + 1px); left: 0; transform: translateX(-50%); white-space: nowrap; padding: 0 7px; border-radius: 999px;
      font-size: 12px; font-weight: 900; line-height: 1.45; color: #fff; background: var(--raid-deep); border: 1.5px solid #fff; text-shadow: none; }
    /* What Phe Phá needs to win, next to its score; gold once it has it. */
    .score .need { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #fff3; border: 1.5px solid #fffc; font-size: 14px; font-weight: 900; line-height: 1.3; }
    .score .need.ok { background: #ffd86f; border-color: #fff; color: #6a35b0; text-shadow: none; }
    /* The last ten seconds: a big number pops in the middle each second, and the board's edge flashes red. */
    .final-count { position: absolute; left: 50%; top: 50%; z-index: 6; pointer-events: none; font-size: 130px; font-weight: 900; line-height: 1; color: #ff4f7b;
      -webkit-text-stroke: 4px #fff; text-shadow: 0 6px 18px #e2245a66; opacity: 0; transform: translate(-50%, -50%); font-variant-numeric: tabular-nums; }
    .final-count.beat { animation: final-beat 1s ease-out forwards; }
    .final-count.last { color: #e2245a; font-size: 150px; }
    @keyframes final-beat { 0% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1); opacity: .9; } 70% { opacity: .75; } 100% { transform: translate(-50%, -50%) scale(.85); opacity: 0; } }
    .pk.final .board { animation: final-edge 1s ease-in-out infinite; }
    @keyframes final-edge { 50% { border-color: #ff4f7b; box-shadow: 0 0 0 4px #ff4f7b55, 0 0 24px #ff4f7b88; } }
    /* ---------- The win (pk.js celebrate) ---------- */
    .win-fx { position: absolute; inset: 0; overflow: hidden; border-radius: 25px; pointer-events: none; }
    .win-fx .fall { position: absolute; top: -30px; font-size: 22px; animation: win-fall linear forwards; }
    .win-fx .fall.paper { width: 9px; height: 14px; border-radius: 2px; }
    @keyframes win-fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 50% { transform: translate(var(--sway, 0), 170px) rotate(calc(var(--spin, 0deg) / 2)); } 85% { opacity: 1; }
      100% { transform: translate(0, 340px) rotate(var(--spin, 0deg)); opacity: 0; } }
    .win-fx .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #fff, #b48cff 55%, #6a35b0); opacity: 0; animation: win-flash 1.1s ease-out forwards; }
    @keyframes win-flash { 0%, 30%, 100% { opacity: 0; } 8% { opacity: .8; } 40% { opacity: .55; } }
    .win-fx .bolt { position: absolute; opacity: 0; filter: drop-shadow(0 0 8px #b48cff); animation: win-bolt .5s ease-out forwards; }
    @keyframes win-bolt { 0% { opacity: 0; transform: translateY(-20px) scale(1.4); } 20% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .win-fx .stamp { position: absolute; left: 300px; top: 74px; padding: 4px 14px; border: 5px solid #e2245a; border-radius: 12px; color: #e2245a; font-size: 30px; font-weight: 900;
      letter-spacing: 2px; text-shadow: none; background: #fff8; transform: rotate(-12deg); opacity: 0; animation: win-stamp .45s cubic-bezier(.3, 1.6, .5, 1) .55s forwards; }
    @keyframes win-stamp { from { transform: rotate(-12deg) scale(3); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .92; } }
    .result h1.shake { animation: title-shake .55s ease-in-out 2; }
    @keyframes title-shake { 20% { transform: translateX(-7px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    /* The boost by Phe Giữ's score pops in as the clock starts. */
    .score .boost.pop { animation: boost-pop .8s cubic-bezier(.2, 1.8, .4, 1); }
    @keyframes boost-pop { 0% { transform: scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
    /* The guide, while the game is on and no round is under way. */
    .guide { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px; padding: 14px 18px; box-sizing: border-box; border-radius: 28px;
      background: linear-gradient(180deg, rgb(255 250 253 / var(--veil)), rgb(255 241 248 / var(--veil))); border: 3px solid #ffd0e8; box-shadow: 0 4px 14px #3b1a3226, inset 0 2px 0 #fff8; }
    .pk.guiding .guide { display: flex; }
    .pk.guiding .board, .pk.guiding .result { display: none; }
    .guide { gap: 6px; padding: 10px 14px; }
    .guide h1 { margin: 0; text-align: center; font-family: "Pacifico", cursive; font-weight: 400; font-size: 24px; line-height: 1.2; color: #d63f87; }
    .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }
    .team { display: flex; flex-direction: column; gap: 3px; padding: 6px 10px; border-radius: 18px; min-height: 0; }
    .team.raid { background: var(--raid-soft); border: 2.5px solid var(--raid); }
    .team.guard { background: var(--guard-soft); border: 2.5px solid var(--guard); }
    .team h2 { margin: 0; font-size: 17px; font-weight: 900; line-height: 1.2; }
    .team.raid h2 { color: var(--raid-deep); }
    .team.guard h2 { color: var(--guard-deep); }
    .team ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
    .team li { display: grid; grid-template-columns: 30px auto 1fr; align-items: center; gap: 7px; height: 30px; }
    .team .pic { width: 30px; height: 30px; border-radius: 9px; background: #fff; display: grid; place-items: center; font-size: 17px; overflow: hidden; animation: bob 1.6s ease-in-out infinite; }
    .team li:nth-child(2) .pic { animation-delay: -.4s; }
    .team li:nth-child(3) .pic { animation-delay: -.8s; }
    .team li:nth-child(4) .pic { animation-delay: -1.2s; }
    .team .pic img { width: 88%; height: 88%; object-fit: contain; }
    @keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg); } }
    .team b { font-size: 16px; font-weight: 900; white-space: nowrap; }
    .team .does { font-size: 14px; font-weight: 800; color: #5a2a4a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    .guide p { margin: 0; text-align: center; font-size: 14px; font-weight: 800; color: #9a5a12; background: rgb(255 247 214 / var(--veil-inner)); border: 2px dashed #f4c95d; border-radius: 14px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="pk" id="pk">
    <div class="board">
      <div class="head">
        <div class="side raid"><b>😈 PHE PHÁ</b><div class="flip" id="raidGift"></div></div>
        <div class="clock" id="clock">0:00</div>
        <div class="side guard"><b>PHE GIỮ 💗</b><div class="flip" id="guardGift"></div></div>
      </div>
      <div class="bar-wrap">
        <div class="bar">
          <div class="fill-guard"></div>
          <div class="fill-raid" id="fillRaid"></div>
          <div class="spark" id="spark">✨</div>
          <div class="score raid" id="scoreRaid">0</div>
          <div class="score guard" id="scoreGuard">0</div>
        </div>
        <!-- The line Phe Phá's purple has to pass to win (15% more than Phe Giữ), placed by pk.js drawScores. -->
        <div class="win-line" id="winLine"><span id="winLineLabel"></span></div>
        <!-- What each gift adds, rising off the bar (pk.js showGain); not clipped by the bar's round ends. -->
        <div class="gains" id="gains"></div>
      </div>
      <!-- Each side's top givers at its end, and the dare in the middle between them. -->
      <div class="mvps">
        <div class="mvp raid" id="mvpRaid"></div>
        <div class="dare">🎯 <span id="dare"></span></div>
        <div class="mvp guard" id="mvpGuard"></div>
      </div>
      <!-- The round's effects (pk.js): a change of lead, a big gift, and the last ten seconds counted out. -->
      <div class="board-fx" id="boardFx"></div>
      <div class="final-count" id="finalCount"></div>
    </div>
    <div class="result" id="result"></div>
    <div class="guide" id="guide">
      <h1>🍯 Trò chơi trên hũ của Ennie</h1>
      <div class="teams">
        <div class="team raid"><h2>😈 Phe Phá: thả Ennie đi tha quà</h2><ul id="guideRaid"></ul></div>
        <div class="team guard"><h2>💗 Phe Giữ: mưa tim cứu hũ</h2><ul id="guideGuard"></ul></div>
      </div>
      <p id="guideRule">Sắp có ván PK: nếu Phe Phá thắng, Ennie phải làm một thử thách! 🎯</p>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <!-- The game's sounds: the Web Audio makings (sfx.js), then the game's own (pksfx.js). -->
  <script src="/sfx.js"></script>
  <script src="/pksfx.js"></script>
  <script src="/pk.js"></script>
</body>
</html>
